name: Daily Dropship Trend Analysis

on:
  schedule:
    - cron: '0 6 * * *'   # Every day at 06:00 UTC
  workflow_dispatch:        # Manual trigger from the GitHub Actions UI

permissions:
  contents: write           # Required to commit and push data/today.json

jobs:
  analyze-and-commit:
    name: Run Gemini Analysis & Commit Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Gemini trend analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run analyze

      - name: Commit updated product data
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/today.json
          git diff --staged --quiet || git commit -m "chore: update daily product trends [$(date -u '+%Y-%m-%d')]"
          git push
